# CI for witness-marks. One FreeBSD job, in the shape rumor and reaper settled
# on (rumor ci.yml, G1 issue 32): no actions/checkout; a timeout(1) on every
# external call plus a timeout-minutes backstop; rc 124 reported separately from
# a failure; `set -o pipefail` in every step; and every step emitting a value
# only execution could have produced -- never a duration, never the absence of
# red. A second job whose label no runner answers would QUEUE FOREVER and read
# as "no failure" rather than "never ran".
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  freebsd:
    runs-on: freebsd-15-jail
    timeout-minutes: 45
    steps:
      - name: probe the runner (non-fatal; names what is absent)
        run: |
          set -o pipefail
          echo "uname   $(uname -a)"
          echo "whoami  $(whoami)"
          for t in git cargo rustc rustup uv; do
            p=$(command -v "$t" 2>/dev/null) && echo "$t  FOUND  $p" || echo "$t  ABSENT"
          done
          timeout 20 rustc --version 2>/dev/null || echo "rustc: none or did not answer in 20s"
          timeout 20 git --version 2>/dev/null || echo "git: none or did not answer in 20s"

      - name: fetch the tree with git, not a JS action
        run: |
          set -o pipefail
          rm -rf src-tree; rc=0
          # NO --depth 1. The mutation-record gate below diffs the commits this
          # push carried, and a shallow clone has no history to diff. A gate
          # that cannot see the change has not cleared it, so it would refuse
          # every run rather than pass a shallow one -- correct, and useless.
          timeout 180 git clone --quiet --branch "${GITHUB_REF_NAME:-main}" \
            https://forge.axonibyte.com/axonibyte/witness-marks.git src-tree || rc=$?
          test "$rc" -eq 124 && { echo "HANG: git clone exceeded 180s (RUNNER finding; 124 proves only that 180s elapsed)"; exit 124; }
          test "$rc" -eq 0 || { echo "git clone exited $rc"; exit "$rc"; }
          cd src-tree
          echo "HEAD $(timeout 30 git rev-parse HEAD)"
          test -f Cargo.lock || { echo "no Cargo.lock: wrong tree, or the lockfile was not committed"; exit 1; }

      # THE METHODOLOGY'S RULE, MECHANIZED. A change that adds assertions must
      # record a mutation kill: a `MUTATION:` line in a commit message, or a
      # file under tests/mutations/ that tools/mutate.sh can re-run. The range
      # comes from the push event, because a job cannot otherwise know which
      # commits a push carried, and it REFUSES when it cannot resolve one.
      - name: new assertions must carry a recorded kill
        run: |
          set -o pipefail
          cd src-tree
          sh tools/check-mutation-record.sh --from-event HEAD

      # THE COUNTER IS TESTED BEFORE IT IS TRUSTED. The passing-test count is
      # this job's proof that execution happened, so the thing that computes it
      # cannot be the one unexercised part of the run. Its arms use committed
      # cargo transcripts, four of them real captures, and they assert stdout as
      # well as rc -- a refusal that printed a number would read as a count.
      - name: the tooling's own arms
        run: |
          set -o pipefail
          cd src-tree
          fail=0
          for t in tools/tests/t_*.sh; do
            echo "== $t"
            rc=0; timeout 300 sh "$t" >arms.out 2>&1 || rc=$?
            cat arms.out
            grep -qE '^-- [0-9]+/[0-9]+ arms pass' arms.out \
              || { echo "$t produced no count of its own: it did not run"; fail=1; }
            test "$rc" -eq 0 || fail=1
          done
          test "$fail" -eq 0

      # AND THE RECORDED KILLS ARE RE-RUN, not taken on the word of a commit
      # message. A mutation record that no longer kills is a record of a test
      # that has since stopped covering what it claims.
      - name: every recorded mutant still kills
        run: |
          set -o pipefail
          cd src-tree
          timeout 1200 sh tools/mutate.sh --all

      - name: build and test, locked
        run: |
          set -o pipefail
          cd src-tree
          command -v cargo >/dev/null 2>&1 || { echo "no cargo on PATH: a PROVISIONING finding, not a code one"; exit 1; }
          echo "toolchain $(timeout 30 cargo --version)"
          rc=0; timeout 1500 cargo test --locked --workspace >test.out 2>&1 || rc=$?
          test "$rc" -eq 124 && { echo "HANG: cargo test exceeded 1500s"; tail -40 test.out; exit 124; }
          # A VALUE ONLY EXECUTION COULD HAVE PRODUCED -- and a refusal where the
          # value would be a lie. This was an inline grep|sed|paste|bc pipeline
          # whose `${passed:-0}` made a missing bc, a build failure and a real
          # empty suite into the same 0, under a message that asserted the third.
          # test-count.sh gives each its own exit, so the log names the state it
          # actually found. Measured on a real mixed transcript: the old pipeline
          # printed "tests passed: 3" for a run that FAILED, because it summed
          # the ok suites and skipped the FAILED line, and only the rc check
          # below kept that from being acted on.
          sh tools/ci-report-count.sh test.out "$rc" || { tail -60 test.out; exit 1; }

      - name: clippy and fmt
        run: |
          set -o pipefail
          cd src-tree
          rc=0; timeout 600 cargo clippy --locked --workspace --all-targets -- -D warnings >clippy.out 2>&1 || rc=$?
          echo "clippy rc=$rc findings=$(grep -cE '^(warning|error)' clippy.out || true)"
          test "$rc" -eq 0 || { tail -40 clippy.out; exit "$rc"; }
          timeout 120 cargo fmt --all -- --check && echo "fmt: clean"
