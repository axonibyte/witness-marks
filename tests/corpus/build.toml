class = "E"
class_why = "Printer limits, minimum printable thickness and self-support slope and layer-line direction, govern the mechanics from outside the model."
state = "The leaf was a feature of a larger part, with three constraints closed on each other so no shape or orientation worked."
measurement = "To self-support, the leaf had to slope past 37 degrees; to slope, it had to be short; to stay soft at 3 mm it had to be 0.3 mm thick, which does not print."
fix = "Splitting the feature into its own part dissolved all three at once, and let the flexure be printed with its layer lines along the bend instead of across it."

[[incident]]
id = "build-055"
source = "build"
n = 55
title = "Check that a part can be INSERTED, not just that it fits."
class = "D"
class_why = "A pair of parts related through travel, not a boundary coincidence: the seated configuration was modeled and the stroke was not."
state = "The clip's seated clearance had been checked, which is one configuration out of the whole stroke, with the assembly path untested."
measurement = "Sweeping the assembly path showed the clip passes between two locating pins with 0.60 mm a side for its entire 3.5 mm travel."
fix = "Sweep the assembly path and test every station, taking the worst station through travel as the governing clearance rather than the one at rest."

[[incident]]
id = "build-056"
source = "build"
n = 56
title = "A clearance in a joint is multiplied by the joint's lever before it reaches the working point."
class = "D"
class_why = "The lever between joint root and working point is an unmodeled relationship; the clearance symbol itself had only one job, so not F."
state = "The blade clip's slot was specified as a clearance fit, with slot slack compared directly against the working deflection."
measurement = "Root 3.5 mm deep, leaf reaching 8.9 mm past it, so lever = (reach + root)/root = 3.54; against 0.35 mm of working deflection, 0.05 mm of slack costs half the clamp and 0.15 mm costs all of it."
fix = "Compute amplified_slack = clearance x lever against the working deflection, and where it is the same order or larger make the joint an interference fit so insertion depth carries the uncertainty."

[[incident]]
id = "build-057"
source = "build"
n = 57
title = "A load that is not along the joint reacts as a COUPLE, so check which face each half pushes on."
class = "D"
class_why = "The load path between the two halves of the joint was unmodeled; no symbol was overloaded and no two features collided."
state = "I assumed the clip pressed into its slot, so only one reaction face was treated as load bearing."
measurement = "Solving it gives roof pushing DOWN at the mouth with 11.2 N and floor pushing UP at the back with 8.1 N, against a 3.2 N load."
fix = "none stated"

[[incident]]
id = "build-058"
source = "build"
n = 58
title = "Check what a face sits on, not just that it is flat."
class = "A"
class_why = "The geometry held what lay beneath each face, but the only available query was flatness; no instrument fabricated a number, so not B."
state = "Faces were checked for being flat, with no query for what sat underneath them."
measurement = '"Flat" lumped a 10.4 mm slot roof anchored on both side walls together with a pad having 15.1 mm of open air beneath it.'
fix = "Stab a ray down from each face and report what it lands on, written so material that ENCLOSES the height reads as supported rather than as nothing there."

[[incident]]
id = "build-059"
source = "build"
n = 59
title = "Test overhangs the way the SLICER does, not with face normals."
class = "B"
class_why = "Face normals return plausible overhang readings blind to bridges and to what lies beneath; the process values themselves were owned, so not E."
state = "Overhangs were being tested from face normals, which are only a proxy for local slope."
measurement = "The real layer-difference test, grown by d = layer_height / tan(threshold), validates against hand-computed shapes at 198.5 vs ~197 for a flat cantilever, 0.0 for 45 and 60 degrees, and 131.1 vs 132.8 for a 30 degree cone."
fix = "`overhang-scan.scad` in this directory implements the slicer's own test, a boolean difference between each 2D layer and the one below grown by d."

[[incident]]
id = "build-060"
source = "build"
n = 60
title = '"45 degrees" is not a property of the model.'
class = "E"
class_why = "A print setting outside the model sets the overhang limit; nothing was stale and no instrument lied, it was simply unowned."
state = 'The overhang limit was carried as "45 degrees", treated as a property of the model.'
measurement = "The limit is atan(layer_height / (0.5 * extrusion_width)) and equals 45 only because 0.2 mm layers at 0.4 mm width make that ratio 1; at 0.1 mm layers the same nozzle holds a 26.6 degree overhang."
fix = "Always state the layer height with the angle."

[[incident]]
id = "build-061"
source = "build"
n = 61
title = "An unsupported region can be a bridge, a droop, or an ISLAND, and only the third is fatal."
class = "A"
class_why = "The island existed in the geometry and every instrument could only interrogate the finished solid; there was no way to ask about the layer sequence."
state = "An unsupported region was being judged by area and angle on the finished solid, which cannot separate a bridge from a droop from an island."
measurement = "I turned a printable 10.5 mm bridge into a 7.5 mm2 floating island while area, angle, genus and component count on the finished solid all said the part was fine."
fix = "Per layer, find connected components and check each one overlaps the previous layer."

[[incident]]
id = "build-062"
source = "build"
n = 62
title = "A self-supporting gable must grow from the walls inward, never from the middle outward."
class = "A"
class_why = "Layer attachment is in the model but a section view cannot ask it; the two gables are not colliding features, so not G."
state = "A self-supporting gable was being judged from a section view, where growing outward from the middle and inward from the walls look identical."
measurement = "none stated"
fix = "When adding a self-supporting feature, name which existing material each new layer lands on; if the answer is the layer below and also new, it is an island."

[[incident]]
id = "build-063"
source = "build"
n = 63
title = "Shift the grid to tell an artifact from a feature."
class = "B"
class_why = "The rasterized check produced a plausible island area out of its own sampling grid, not out of the geometry."
state = "A rasterized buildability check was running on one fixed sampling origin and cell size."
measurement = "A flagged 0.09 mm2 island vanished when the sampling origin was moved, and halving the cell kept it at exactly one cell."
fix = "Re-run the check with the sampling origin shifted and the cell halved; a real feature holds its area under both, which decides an ambiguous positive in one extra run."

[[incident]]
id = "build-064"
source = "build"
n = 64
title = "An unmeasured input does not fail where you wrote it."
class = "E"
class_why = "A physical dimension nobody owned or measured governed the mechanics downstream; no instrument produced the number, it was assumed."
state = "`razor_notch_distance = 12.7` was a plausible-looking number nobody had measured, feeding pin positions, clip width, spring rate and clamp force."
measurement = "The real blade reads 6.52, and the wrong value surfaced four steps away as a 9.83 mm3 collision between two parts that had both passed every check."
fix = "Tag every input with where it came from, and treat `assumed` as a defect waiting for a trigger rather than as a value."

[[incident]]
id = "build-065"
source = "build"
n = 65
title = "Fits must be split from functions."
class = "F"
class_why = "One thickness symbol carried a spring rate and a slot fit, two unrelated jobs; nothing about it was stale or boundary coincident."
state = "The clip's thickness set the spring rate, which must be a whole number of layers, and also filled a slot, which must match the printer."
measurement = "none stated"
fix = "Split the two jobs into separate numbers and put the tunable half on whichever part is cheapest to reprint, here the clip at 40 facets against an hour for the stage."

[[incident]]
id = "build-066"
source = "build"
n = 66
title = "A joint centered on the edge of a cut is half a joint."
class = "G"
class_why = "Both features were correct; the socket's derived angle landed exactly on the mouth cut's boundary, which is coincidence rather than overload."
state = "The stage's two dovetail sockets sat at `horn_deg = mouth_deg / 2` = 34 deg while the mouth was removed by `pie(angle = mouth_deg)`, which spans exactly +/-34."
measurement = "A 52.8 mm3 probe outboard of each flank measured it: the mouth-side flanks read ZERO, the outboard ones read 52.800."
fix = "none stated"

[[incident]]
id = "build-067"
source = "build"
n = 67
title = "A 45-degree ramp's reach is a budget, and it is usually already spent."
class = "D"
class_why = "The ramp's reach is a relationship across parts whose base and rise are fixed elsewhere; the symbols each had one job, so not F."
state = "A 45-degree ramp was being tuned to reach the blade's slanted edges, with its base and its rise both fixed by other features."
measurement = "Material was needed at half-width 15.9 (spine) to 26.4 (front) against the carrier's +/-9.5 plus 3.9 mm of rise, so +/-13.4, short everywhere; `shelf_w = 26` had spent the same budget years earlier and the blade's spine already overhung the shelf by 2.9 mm."
fix = "Widen the BASE: move `leaf_y_in` from 8.5 to 24 carrying `leaf_y_out` out with it so leaf length and spring rate never changed, after which the walls are vertical and the ramp is not needed."

[[incident]]
id = "build-068"
source = "build"
n = 68
title = "A retaining lip should BE the 45-degree plane, not sit on one."
class = "E"
class_why = "A print-process behavior, droop at a given layer height, consumed the very gap that is the fit; no in-model relationship was missing."
state = "A retaining lip reached `rail_h` over the part as a flat roof, which printed upright is a cantilever over the fit gap."
measurement = "2.5 mm of flat roof at 0.15 mm layers droops into the gap; probed across the slant at 1 mm steps the corrected lip reads 0.322 / 1.539 / 3.058 / 3.904 mm3 of a 4.000 mm3 box, the ramp exactly."
fix = "Make the lip's underside the 45-degree plane itself, touching the retained part at the wall and climbing away inward, so it retains by line contact and every layer oversteps the one below by exactly `layer_h`."

[[incident]]
id = "build-069"
source = "build"
n = 69
title = '"There is a window at that azimuth" is a claim about a height.'
class = "B"
class_why = "Reading the cut's parameters served as the instrument and returned a plausible extent for a height it never answered for."
state = "I read `leg_at = [60, 180, 300]` and the `arched_window` parameters and concluded the dovetail boss's ramp foot at z = 65.3 was standing on air, then added two legs."
measurement = "Measured afterward: 179.910 mm3 of 180.000 under both feet with the ORIGINAL legs, identical, because by z = 62..68 that window has pinched to +/-8 mm of chord around 0 deg."
fix = "Reverted the two added legs, which bought nothing; read a swept or tapered cut's extent at your own z rather than from its parameters."

[[incident]]
id = "build-070"
source = "build"
n = 70
title = "Entry 65 again, in a different part: one clearance doing three jobs."
class = "F"
class_why = "One symbol, `thr_clear`, set running clearance, rib height and bore centring, three unrelated jobs; the collision was of jobs, not positions."
state = "`thr_clear` set the thread's running clearance, the rib's height and the carrier's centring in the bore, and the carrier slid past its own thread."
measurement = "engagement = thr_depth - thr_clear = 0.40 mm against lateral slop = thr_clear = 0.50 mm, so retention was NEGATIVE by 0.10 mm while the part still assembled, screwed and looked right."
fix = "Split the centring out as `core_clear = 0.25` and cut `thr_clear` to 0.3, giving 0.60 against 0.25, 2.4:1, and carry forward the inequality that engagement must exceed perpendicular wander."

[[incident]]
id = "build-071"
source = "build"
n = 71
title = "A rectangle laid against a cylinder overhangs at its corners."
class = "G"
class_why = "The ramp was correct and the round wall was correct; their footprints collide at the slab's corners, a position collision not a missing relationship."
state = "The dovetail boss's ramp foot was a 14 mm wide slab reaching to `body_r` against a round wall."
measurement = "The slab's two corners stood up to 0.65 mm outside the wall, four thin crescents of flat unsupported bottom, 7.56 mm2 on one layer."
fix = "Pull the foot in to `sqrt(body_r^2 - halfwidth^2)` and also drop it by its own radial run, since pulling in alone lengthens the run without changing the rise and flattens the ramp from 45 to 39.8 deg."

[[incident]]
id = "build-072"
source = "build"
n = 72
title = "Deleting a part deletes the reason it existed."
class = "C"
class_why = "The puck's geometric margin stayed current after fusing invalidated it elsewhere; no instrument lied and no parameter was overloaded."
state = "The free puck had been fused to the carrier for assembly, and the drag margin derived for the free puck was still the number being quoted."
measurement = "The puck took drag at a 5-11 mm thrust land, mean radius 8.4 mm, out-resisted by the thread 3.7:1; fused, the can feeds drag in at roughly 26 mm against the thread's 34 mm, about 1.3:1."
fix = "none stated"

[[incident]]
id = "build-073"
source = "build"
n = 73
title = "A post standing in a notch has nothing underneath it."
class = "F"
class_why = "One feature was asked to do locating and clamping, two unrelated jobs, the F shape applied to a feature rather than to a symbol."
state = "Two posts standing in the blade's notches were asked to back up the retaining lip, and a notch is a VOID with no workpiece beneath it."
measurement = "A 45-degree flare on the post reaches blade only after 0.41 mm of rise and catches it at 0.56 mm of lift, against the lip's 0.15; the notch is a keyhole, 3.2 mm where it opens at the spine and 3.62 at its root."
fix = "Keep the posts for the job they can do, guiding and stopping travel along the blade's length, key pin_d to top_width so the post clears the mouth it passes through, and accept the leftover 0.41 mm of root slack."

[[incident]]
id = "build-074"
source = "build"
n = 74
title = "The travel stop was a part nobody was checking against."
class = "D"
class_why = "A moving part against a neighbor through travel: interference appears only as it advances, which no static or coincident-boundary reading would show."
state = "The flexure was designed around its own rate and the blade was positioned against the CAN, with the frame never checked as the thing the blade hits."
measurement = "The cutting edge reaches +/-32.10 deg at rest, +/-33.74 at 0.6 mm and +/-35.31 at 1.2, against a +/-34 deg mouth, about 0.65 mm of usable travel; frame X blade measured 0.009 mm3 at 1 mm of advance and 0.158 at 1.5, in two pieces, while interference at rest was ZERO."
fix = "Check a moving part against every neighbour THROUGH ITS TRAVEL, taking the sweep as the test rather than the assembled position, and ask at what radius the two parts coexist rather than comparing extents."

[[incident]]
id = "build-075"
source = "build"
n = 75
title = "Bound a cut with an existing feature, not a number."
class = ""
class_why = "No failure is reported: a cut's limit was chosen from an existing feature instead of a picked number, which none of the seven shapes describes."
state = "Opening the mouth needed a new angular limit and nothing had yet been chosen to bound the cut."
measurement = "The socket flank corner gives +/-51.57 deg, the edge could advance to x = 24.0 before reaching it against a can at 33.0, and the cut reduced the frame's unsupported area in that band 212.49 -> 188.83 mm2 over 130 layers with the worst layer unchanged at 2.116."
fix = "Bound the cut at the outermost corner of each dovetail socket's outboard flank, a face already there for another reason, instead of a figure somebody picked."

[[incident]]
id = "build-076"
source = "build"
n = 76
title = "Intersect a keyed feature with the REST OF ITS OWN PART, not only with the part it mates."
class = "G"
class_why = "Two correct features inside one part, the tie bridge and the male dovetail, occupy the same space; the overlap is positional, not a lying number."
state = "A bridge was added to tie each male dovetail out to a yoke, beginning at the dovetail's own DEEP end and as wide as the socket with no clearance, unioned inside the same part."
measurement = "`intersection() { stage_tenons(); stage_yoke(); }` = 744.6 mm3, which was 100.0% of both tenons, leaving a plain 9.0 mm bar that cannot pass a 6.0 mm socket mouth, while `intersection() { frame(); stage_tenons(); }` was EMPTY and `intersection() { frame(); whole_part(); }` came back 101.2 mm3."
fix = "Test `intersection() { frame(); whole_part(); }`, then one intersection per module to name which module did it, and add that check for any feature whose JOB is its shape."

[[incident]]
id = "build-077"
source = "build"
n = 77
title = "A flat face stopping against a concave cylinder touches at its CORNERS, so the gap at the face center is not the gap."
class = "D"
class_why = "The contact relationship between a flat face and a concave bore was unmodeled; both parts were correct in themselves, so not G."
state = "The press stop was a cube reaching out to the yoke's inner bore with its outer face set tail_gap = 0.515 mm short of the wall, the gap taken at the face center."
measurement = "Its corners, grip_w/2 = 6 mm off axis at radius 66.9, were only 0.244 mm off the wall, the sagitta r - sqrt(r^2 - (w/2)^2), so the stop fired at roughly half the intended travel and measured 0.50 mm INSIDE the wall at full press."
fix = "Trim the stop's outer face with a cylinder concentric with the bore so the gap is identical across the width, then re-derive from a sweep: the arc tail advanced 0.326 mm of radius per degree, 0.723 mm for the stroke, engaging at 2.209 deg against a 2.221 target."
