# WHERE THE TIME WENT (issue 61). One verdict per corpus incident:
# `measurement` if it was spent measuring the wrong thing, `scope` if it was
# spent BUILDING the wrong thing, `unknown` if the record does not settle it.
#
# WHY THIS IS A SEPARATE FILE and not a field added to the 108 incident
# records: the same reason tests/corpus/rediscovery.toml is separate. The
# incident text is the log as it was written; a verdict is a judgment made
# later, and mixing them makes it impossible to tell which is which.
#
# WHAT SPEC §10 TEST 6 IS ASKING, and why it cannot be answered yet:
#
#   "Zero logged entries record building the wrong thing, and the project's
#    most expensive turn was exactly that. If scope drift costs more than
#    measurement in real use, a server built to these seven classes solves the
#    cheaper half with great precision."
#
# A corpus that cannot express the more expensive half cannot be used to argue
# the project addresses it. This file is where that half becomes expressible.
#
# EVERY ENTRY IS `unknown`, AND THAT IS THE HONEST STARTING STATE. The 108
# records were written before this question was asked: they carry `state`,
# `measurement` and `fix`, and `measurement` says HOW a defect was found, never
# what it cost. Deciding retroactively where a day went, from prose written
# without the question in mind, is 108 guesses -- and a precise-looking
# fraction built on guesses is worse than no fraction.
#
# THE CLASS DOES NOT SETTLE IT, which was the tempting shortcut. The seven
# classes say what KIND of defect each was; the cost says where the TIME went,
# and those come apart. A class-D fit modelled nominal-to-nominal could have
# cost SCOPE time (a part printed and rebuilt) or MEASUREMENT time (no way to
# tell it would not fit). So no class-to-cost rule is applied here.
#
# WHAT THE CORPUS DOES SETTLE: none of the seven classes describes building the
# wrong thing. That is test 6's claim, and tools/cost.py now checks it rather
# than restating it -- so the day an incident is classed `scope`, the fraction
# stops being a guess and the claim stops being true.


[[cost]]
id = "build-001"
verdict = "unknown"
why = "the record predates the question: it says how the defect was found, not what finding it cost"

