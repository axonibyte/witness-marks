# `by` NAMES THE CHECK; `fixture` NAMES THE DATA. These were both the data file
# until rook pointed at it (coop wm-review/3, F4) -- and the gate's existence
# test could not tell, because a data file exists just as hard as an arm does.
by = "tools/tests/vectors-arms.sh"
fixture = "tests/vectors/vectors.toml"
# AND IT IS OUTSIDE THE CI-GREEN SET, which the report now states rather than
# averaging away. battery.sh and ci.yml both glob `tools/tests/t_*.sh`;
# vectors-arms.sh matches neither, and CI's runner reports `openscad ABSENT`
# besides. So "battery green" says NOTHING about this re-find.
in_ci_green = false
note = """
The stale-file guard: a run that read the PREVIOUS run's STL and reported it \
as this one's. vector-run.py unlinks the output and $WMVEC_OUT exists so the \
guard can be driven against a planted stale file -- which is what makes this a \
re-finding rather than a citation."""

