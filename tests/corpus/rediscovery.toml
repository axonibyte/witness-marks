# THE REDISCOVERY GATE (issue 45). One verdict per corpus incident: can this
# project's checks RE-FIND the defect, and which one does it?
#
# WHY THIS IS NOT "REVERT EACH FIX", which is what issue 45 asked for.
# MEASURED across all 108 entries: 42 state no fix at all, 12 name a change to
# the design, 1 names the provider, and 53 are prose design DECISIONS -- "Overlap
# mating features by a real amount (0.5-1 mm)", "Clearance applied: 0.35 mm on
# the thread". There is no revertible artifact in this repository for 107 of
# them; those fixes live in a design file's history and in English. So the
# executable form of the same question is RECONSTRUCT AND DETECT: build the
# defect as a fixture, and name the check that fires.
#
# THE STARTING NUMBER, AND IT IS THE POINT. MEASURED 2026-11-18: exactly ONE
# corpus id is cited by any check in this tree -- mcp-026, in vectors.toml,
# vector-run.py, vectors-arms.sh and the mutation record. The issue says "a
# green battery that cannot re-find the 106 is not yet measuring anything", and
# the honest answer is that it demonstrably re-finds 1 of 108. A matrix saying
# so is worth more than a padded one, and tools/rediscovery.py refuses any
# verdict that cannot point at a check and a fixture that both exist.
#
# verdict = "re-found"   requires `by` (a check that exists) and `fixture` (a
#                        path that exists). Nothing else may claim coverage.
# verdict = "not-found"  a defect we have looked at and cannot currently
#                        detect. Requires `why`.
# verdict = "unassessed" nobody has tried yet. Requires `why`. The default, and
#                        the number this gate exists to drive down.


[[rediscovery]]
id = "build-001"
verdict = "unassessed"
why = "no fixture reconstructs this defect yet, and no check of ours names it"

