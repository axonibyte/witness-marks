# THE TWELVE GUARDS (issue 36, spec §06.1), over the real harness.
#
# A THIRTEENTH IS AVAILABLE AND NOT BUILT, noted 2026-11-19 during the
# endpoint audit. `bite_stop` = 0.80 has everything the other twelve mostly
# lack: a sourced value, a sourced DERIVATION ("0.30 of advance to touch, 0.40
# to be through, and 0.80 leaves 0.40 mm of margin"), and a sourced REJECTION
# ("At the 1.80 this started at, a centred can is buried 2.10 mm, which is the
# blade's wedge jammed through the slit, tearing rather than cutting"). Adding
# a guard is a decision about what this project checks, not a consequence to
# repair, so it is recorded here rather than taken.
#
# WHY THESE ARE HERE AND NOT IN can_cutter.scad. cal asked, fairly, why this
# needed to edit their design file. IT DOES NOT. Issue 60 landed
# `Expression::Scad`, so a guard's expression is evaluated in the MODEL's own
# variable scope through `scad_eval` -- the number is never restated here, only
# the envelope it has to stay inside and the reason why. The harness's prose
# keeps its reasoning; these keep its arithmetic honest. Nothing was written
# into the design.
#
# WHAT THEY WOULD HAVE CAUGHT, measured 2026-11-18 against the live file.
# `wall` moved 4.0 -> 5.0, and the harness says so at its own definition
# ("wall thickness. Was 4.0, which left only"). Two derived numbers in the
# prose did not follow it:
#
#   line 18  "a 37.6 mm outer wall"                 body_r is now 38.6
#   line 74  "wall - thr_depth - thr_clear = 2.6"   it is now 3.8
#
# One parameter changed; the author documented the change AT ITS SITE and did
# not propagate it to the two places that depended on it. That is spec §06.2's
# mechanism exactly -- "six of the harness's twelve derived numbers went
# stale" -- happening again while this project was being built to catch it.
#
# EVERY RANGE IS AN ENVELOPE, NEVER THE CURRENT VALUE. A range of
# (current - epsilon, current + epsilon) is a restatement that passes until
# somebody edits it, which is the one edit tests/vectors/README forbids. These
# say what the design NEEDS, and the current value sits inside with room.
#
# EVERY `because` IS THE HARNESS'S OWN REASON, quoted or paraphrased from the
# comment it retires the arithmetic of. A range without a reason becomes
# folklore the moment its author moves on.
model = "/data/projects/tech/designs/arts/can_cutter.scad"

[[guard]]
name = "blade_crosses_the_outer_wall"
source = "sqrt(r_edge*r_edge + (61/2)*(61/2)) - body_r"
range = [0.5, 25.0]
unit = "mm"
cites = [
  { endpoint = "low", value = 0.5, unsourced = "the model file names no number for this endpoint, so the value is chosen -- but its SIDE is sourced: the tips sit at 44.7 mm against a 38.6 mm wall, so the crossing is 6.1 mm; the source states only that it MUST be a crossing", excludes = { value = 0.0, file = "arts/can_cutter.scad", line = 18, quote = "The blade MUST cross the wall; only its holder can live outside" } },
  { endpoint = "high", value = 25.0, unsourced = "no mm-valued statement in the model file gives this endpoint; it is an envelope I chose. rook measured the whole set on 2026-11-19 (thread:wm-review/22-23): of 24 endpoints only 2 sat inside a quote, and BOTH of those misread it. Declared rather than dressed up" },
]
because = """
The harness, line 13: the edge is a STRAIGHT 61 mm line and the can is a \
cylinder, so it can only touch at the tangent point; the tips of that edge \
must sit outside the body or the blade cannot reach the can at all. "The \
blade MUST cross the wall; only its holder can live outside." Positive means \
it crosses. This is the margin whose stated value (44.7 against 37.6) went \
stale when `wall` moved."""

[[guard]]
name = "can_turns_freely_in_the_bore"
source = "bore_r - can_dia/2"
range = [0.3, 1.2]
unit = "mm"
cites = [
  { endpoint = "low", value = 0.3, unsourced = "the model file names no number for this endpoint, so the value is chosen -- but its SIDE is sourced: zero slop is a press fit, which is the opposite of the property named", excludes = { value = 0.0, file = "arts/can_cutter.scad", line = 37, quote = "radial slop so the can turns freely" } },
  { endpoint = "high", value = 1.2, unsourced = "no mm-valued statement in the model file gives this endpoint; it is an envelope I chose. rook measured the whole set on 2026-11-19 (thread:wm-review/22-23): of 24 endpoints only 2 sat inside a quote, and BOTH of those misread it. Declared rather than dressed up" },
]
because = """
`can_clearance`'s own comment: "radial slop so the can turns freely". Below \
0.3 the can binds on a seam or a dent; above 1.2 it rattles and the score \
wanders off the line."""

[[guard]]
name = "material_left_under_the_thread_groove"
source = "wall - thr_depth - thr_clear"
range = [3.0, 6.0]
unit = "mm"
cites = [
  { endpoint = "low", value = 3.0, unsourced = "the model file names no bound for this endpoint, so the number is chosen -- but its SIDE is fixed by a rejection the source does state, in `excludes` below", excludes = { value = 2.6, file = "arts/can_cutter.scad", line = 74, quote = "wall - thr_depth - thr_clear = 2.6 mm of material" } },
  { endpoint = "high", value = 6.0, unsourced = "no mm-valued statement in the model file gives this endpoint; it is an envelope I chose. rook measured the whole set on 2026-11-19 (thread:wm-review/22-23): of 24 endpoints only 2 sat inside a quote, and BOTH of those misread it. Declared rather than dressed up" },
]
because = """
The groove is cut into the wall, so what remains carries the load. The \
harness states this arithmetic at line 74 and its stated result (2.6) is the \
second number `wall`'s change left behind. Below 1.5 the wall is a hinge; \
above 6 the part is heavier than it needs to be."""

[[guard]]
name = "overhang_critical_angle_at_this_layer_height"
source = "atan(layer_h/0.2)"
range = [20.0, 44.0]
unit = "deg"
cites = [
  { endpoint = "low", value = 20.0, unsourced = "no deg-valued statement in the model file gives this endpoint; it is an envelope I chose. rook measured the whole set on 2026-11-19 (thread:wm-review/22-23): of 24 endpoints only 2 sat inside a quote, and BOTH of those misread it. Declared rather than dressed up" },
  { endpoint = "high", value = 44.0, unsourced = "the model file names no bound for this endpoint, so the number is chosen -- but its SIDE is fixed by a rejection the source does state, in `excludes` below", excludes = { value = 45.0, file = "arts/can_cutter.scad", line = 22, quote = "45 would also take the low-side lip to 15 deg" } },
]
because = """
The slicer criterion from the harness's own note: "WHY 30 AND NOT 45: at \
layer_h = 0.15 and a 0.4 mm nozzle, atan(0.15/0.2) = 36.9 deg, not the 45 \
this file's geometry assumes." The angle is a CONSEQUENCE of layer height and \
extrusion width, not a constant -- it is 45 only at 0.2/0.4. Any overhang \
rule written against 45 is wrong at this layer height."""

[[guard]]
name = "score_travel_reaches_up_the_can"
source = "blade_z - floor_z"
range = [14.0, 72.0]
unit = "mm"
cites = [
  { endpoint = "low", value = 14.0, file = "arts/can_cutter.scad", line = 31, quote = "scores 14-72 mm above the can bottom" },
  { endpoint = "high", value = 72.0, file = "arts/can_cutter.scad", line = 31, quote = "scores 14-72 mm above the can bottom" },
]
because = """
CORRECTED 2026-11-19, rook F15b (thread:wm-review/22). This range was \
[14, 80]. The 80 is the BLADE HEIGHT, not a score: the source says "the legs \
put the blade 80 mm up", and the travel it vouches for is "scores 14-72 mm \
above the can bottom" (arts/can_cutter.scad:31) -- the citation said "the \
harness, line 29", wrong file and wrong line. \
THE FLOOR IS STILL 14 AND THAT IS DELIBERATE, but it is not what the old \
reason claimed. The source calls 14 "what cuts nothing anybody wants" for a \
36 mm RING with the blade at 20 -- a different design, which is why the legs \
exist -- and separately states the leg design's travel as 14-72. So 14 is the \
bottom of the MECHANISM's range, quoted, and NOT a usefulness threshold. The \
smallest USEFUL score is not stated anywhere in the source, and this guard \
does not invent one: see `cites`, where that endpoint's usefulness is declared \
unsourced."""

[[guard]]
name = "blade_bites_inside_the_can_wall"
source = "can_r - r_edge"
range = [0.15, 0.80]
unit = "mm"
cites = [
  { endpoint = "low", value = 0.15, unsourced = "the model file names no number for this endpoint, so the value is chosen -- but its SIDE is sourced: zero bite is an edge resting on the wall rather than inside it", excludes = { value = 0.0, file = "arts/can_cutter.scad", line = 40, quote = "how far inside the can wall the edge sits" } },
  { endpoint = "high", value = 0.8, unsourced = "CHOSEN, and the model file contains a 0.80 that is NOT this one. That 0.80 is `bite_stop`, 'THE DEEPEST BITE THE MECHANISM CAN REACH' (line 199); this guard measures `blade_bite`, 'how far inside the can wall the edge sits' AT REST, which is 0.30. Citing the first for the second would be rook F15a again -- a number reused across quantities because it was adjacent and matched. Said here because a reader who greps 0.8 WILL find that passage and think this endpoint is sourced. If a relation between them is wanted it has to be stated by the design, not inferred here" },
]
because = """
`blade_bite`'s own comment: "how far inside the can wall the edge sits". Too \
little and the edge rides on the paint; too much and it ploughs rather than \
scores, and the tilt note warns that 10 deg already puts the edge 0.80 mm \
inside."""

[[guard]]
name = "body_wall_is_thick_enough_to_hold_a_groove"
source = "body_r - bore_r"
range = [4.5, 8.0]
unit = "mm"
cites = [
  { endpoint = "low", value = 4.5, unsourced = "the model file names no bound for this endpoint, so the number is chosen -- but its SIDE is fixed by a rejection the source does state, in `excludes` below", excludes = { value = 4.0, file = "arts/can_cutter.scad", line = 73, quote = "Was 4.0, which left only" } },
  { endpoint = "high", value = 8.0, unsourced = "no mm-valued statement in the model file gives this endpoint; it is an envelope I chose. rook measured the whole set on 2026-11-19 (thread:wm-review/22-23): of 24 endpoints only 2 sat inside a quote, and BOTH of those misread it. Declared rather than dressed up" },
]
because = """
This IS `wall`, read back out of the two radii that depend on it, so a change \
to either radius that silently changes the wall is caught here. Its own \
comment records the last such change: "Was 4.0, which left only" -- and that \
change is what staled the two numbers above."""

[[guard]]
name = "mouth_opens_wide_enough_to_admit_the_can"
source = "mouth_deg"
range = [37.0, 68.0]
unit = "deg"
cites = [
  { endpoint = "low", value = 37.0, file = "arts/can_cutter.scad", line = 22, quote = "removes a 37-64 degree window at the cut plane" },
  { endpoint = "high", value = 68.0, file = "arts/can_cutter.scad", line = 26, quote = "~292 degrees of bore still holds a can concentric easily" },
]
because = """
CORRECTED 2026-11-19, rook F15a (thread:wm-review/22). This range was \
[40, 110] and BOTH ENDS WERE WRONG. The 40 was read out of "leaving the layer \
above to bridge ~40 mm unsupported" -- FORTY MILLIMETRES OF BRIDGE, reused as \
forty DEGREES of mouth. The 110 was vouched for by nothing at all: the source \
says "~292 degrees of bore still holds a can concentric easily", which is a \
68 degree mouth, and 110 would leave 250. The citation was also wrong twice \
over -- it said "the harness, line 22", and the text is in the MODEL file, \
arts/can_cutter.scad, at line 23. \
Both endpoints now come from degree-valued statements in that file: 37 is the \
narrow end of "removes a 37-64 degree window at the cut plane" (line 22), and \
68 is 360 - 292 from "~292 degrees of bore still holds a can concentric \
easily" (line 26), which is the widest mouth the source vouches for holding \
-- AND THE DESIGN SITS EXACTLY ON IT. Measured 2026-11-19: mouth_deg is 68.0, \
so this endpoint has NO HEADROOM, which the header's "the current value sits \
inside with room" does not describe. That is deliberate and it is a CEILING \
AT THE VOUCHED LIMIT rather than an envelope with slack: the source vouches \
for 292 degrees of bore holding a can, so any widening of the mouth leaves \
what anybody has actually checked. Said here because a reader comparing the \
value to the bound will notice, and should find the reason rather than a \
coincidence \
concentric -- the note's "~292 degrees of bore still holds a can concentric \
easily" is the other end of this."""

[[guard]]
name = "stub_overlaps_rather_than_abutting"
source = "stub_lap"
range = [0.2, 1.5]
unit = "mm"
cites = [
  { endpoint = "low", value = 0.2, unsourced = "the model file names no number for this endpoint, so the value is chosen -- but its SIDE is sourced: zero lap IS the coincident-face case the source rejects by name", excludes = { value = 0.0, file = "arts/can_cutter.scad", line = 739, quote = "so the two solids actually overlap rather than meeting at two coincident faces" } },
  { endpoint = "high", value = 1.5, unsourced = "no mm-valued statement in the model file gives this endpoint; it is an envelope I chose. rook measured the whole set on 2026-11-19 (thread:wm-review/22-23): of 24 endpoints only 2 sat inside a quote, and BOTH of those misread it. Declared rather than dressed up" },
]
because = """
Corpus build-002: "Overlap mating features by a real amount (0.5-1 mm) \
instead of abutting them." An abutment is a coincident face, which is the \
class-A defect no view surfaces."""

[[guard]]
name = "tail_gap_clears_without_rattling"
source = "tail_gap"
range = [0.6, 1.1]
unit = "mm"
cites = [
  { endpoint = "low", value = 0.6, unsourced = "the model file names no bound for this endpoint, so the number is chosen -- but its SIDE is fixed by a rejection the source does state, in `excludes` below", excludes = { value = 0.515, file = "arts/can_cutter.scad", line = 713, quote = "The cube-faced version used 0.515" } },
  { endpoint = "high", value = 1.1, unsourced = "no mm-valued statement in the model file gives this endpoint; it is an envelope I chose. rook measured the whole set on 2026-11-19 (thread:wm-review/22-23): of 24 endpoints only 2 sat inside a quote, and BOTH of those misread it. Declared rather than dressed up" },
]
because = """
A printed clearance below ~0.4 mm closes up under the first layer's squish on \
this printer; above 1.1 the tail moves enough to lose the score line."""

[[guard]]
name = "leaf_is_thick_enough_to_print_and_thin_enough_to_flex"
source = "leaf_t"
range = [0.8, 2.0]
unit = "mm"
cites = [
  { endpoint = "low", value = 0.8, unsourced = "0.8 is two extrusion widths at the 0.4 mm nozzle the model names (line 66), which is arithmetic rather than a quoted bound -- but the SIDE is sourced from this project's own harness, which rejects anything under two widths", excludes = { value = 0.7, file = "tests/corpus/source-buildability-tests.md", line = 28, quote = "A 0.7 mm slot is under two extrusion widths" } },
  { endpoint = "high", value = 2.0, unsourced = "no mm-valued statement in the model file gives this endpoint; it is an envelope I chose. rook measured the whole set on 2026-11-19 (thread:wm-review/22-23): of 24 endpoints only 2 sat inside a quote, and BOTH of those misread it. Declared rather than dressed up" },
]
because = """
The leaf is the spring. Below 0.8 it is fewer than three extrusions wide at a \
0.4 nozzle and prints as a wall with no core; above 2.0 it stops flexing and \
the squeeze goes into the arm instead."""

[[guard]]
name = "arm_is_stiffer_than_the_leaf_it_carries"
source = "arm_t - leaf_t"
range = [1.0, 8.0]
unit = "mm"
cites = [
  { endpoint = "low", value = 1.0, unsourced = "the model file names no number for this endpoint, so the value is chosen -- but its SIDE is sourced: the arms are rigid and the leaf is the flexure, so a non-positive difference inverts the design's own division of labour", excludes = { value = 0.0, file = "arts/can_cutter.scad", line = 124, quote = "rigid stand-off arms, from horn to leaf" } },
  { endpoint = "high", value = 8.0, unsourced = "no mm-valued statement in the model file gives this endpoint; it is an envelope I chose. rook measured the whole set on 2026-11-19 (thread:wm-review/22-23): of 24 endpoints only 2 sat inside a quote, and BOTH of those misread it. Declared rather than dressed up" },
]
because = """
The arm must not be the thing that bends -- if it flexes with the leaf, the \
squeeze rate is the sum of two springs and the latch force stops being \
predictable. Positive and clear of 1 mm keeps the compliance in the leaf."""
