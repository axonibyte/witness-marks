# Cross-implementation vectors. See README.md.
#
# `@FIXTURES@` IS EXPANDED BY tools/vector-run.py to this checkout's
# tests/fixtures. It is a placeholder rather than a path because the committed
# file previously carried ABSOLUTE paths into one machine's checkout -- which
# resolved on that machine and pointed at a foreign tree everywhere else. CI
# caught it on a fresh clone for TEN COMMITS while every local run read green,
# because locally the absolute path happened to land inside the tree under
# test. A committed model must name nothing outside the repository.

# THE `provider = { ... }` LINES ARE THE OTHER SIDE, measured 2026-11-16 by
# speaking MCP to the pinned openscad-mcp and calling its `measure` tool on the
# same model. They are recorded, not asserted: the runner computes OUR side and
# compares it to `expected`. Where the two disagree the disagreement is the
# finding, and where only one side can answer at all, that is a finding too.

# WHICH PROVIDER, AS DATA (issue 62). The paragraph above already said "the
# pinned openscad-mcp" -- and for days a `provider_disagrees` three screens
# down attributed a gap to OpenSCAD 2026.11.05.nightly, which the pinned
# provider does not run. Both statements sat in this file and nothing could
# compare them, because one was prose and the other was free text. PROSE A
# READER MUST JOIN UP IS NOT A CHECK.
#
# TWO providers are reachable from this machine and only one can have produced
# these figures:
#   LOCAL  serverInfo "OpenSCAD MCP Server" 4.2.0, 12 tools INCLUDING measure
#          and scad_eval, kernel 2026.10.14, spawned by `uv run --frozen
#          --no-dev openscad-mcp` in provider/ -- the same launcher guards.py,
#          vector-run.py and wm-provider use.
#   REMOTE "openscad-mcp" 1.0.0 over HTTP behind an ephemeral tunnel, 11 tools,
#          NEITHER measure NOR scad_eval, kernel 2026.11.05.nightly on its own
#          host. It cannot produce a `measure` reading, so no figure here came
#          from it -- and its kernel is where the wrong attribution came from.
#
# tools/vector-run.py refuses a `provider` block when this record is absent or
# incomplete, and refuses a `because` that names any kernel but this one.
# tools/tests/vectors-arms.sh drives the identity against the live provider,
# because a recorded identity nobody reads back is the same defect again.
[provider_provenance]
server_name = "OpenSCAD MCP Server"
server_version = "4.2.0"
tool_count = 12
kernel = "2026.10.14"
launcher = "uv run --frozen --no-dev openscad-mcp"
measured = "2026-11-16"

# EVERY EXPECTATION HERE WAS RECORDED FROM A RUN AND THEN COMMITTED.
# Do not edit an expectation to make a run pass; that is the one edit that
# turns a vector into a restatement of whatever the code currently does.

[[vector]]
id = "cube-volume"
provider = { volume = 1000.0, component_count = 1, is_watertight = true }
# One solid, closed: a cube is a single watertight component by construction.
components = 1
watertight = true
n = 1
question = "volume"
fn = 0
why = """
A cube's volume is a closed form and the MATHEMATICS is the oracle, not either implementation. If this disagrees, nothing below is worth reading."""
model = """
cube([10, 10, 10]);"""
expected = 1000.0
tolerance = 1e-09

[[vector]]
id = "cube-bbox"
n = 2
question = "bbox"
fn = 0
why = """
The bounding box of an axis-aligned cube. Closed form."""
model = """
cube([10, 20, 30]);"""
expected = [10.0, 20.0, 30.0]
tolerance = 1e-09

[[vector]]
id = "rotated-cube-bbox"
provider = { dimensions = [14.1421, 14.1421, 10.0] }
n = 3
question = "bbox"
fn = 0
why = """
A cube turned 45 degrees about z. The box becomes the diagonal, 10*sqrt(2) = 14.142136, and the height is unchanged. Closed form, and it catches a kernel that rotates the BOX instead of the solid."""
model = """
rotate([0, 0, 45]) cube([10, 10, 10], center = true);"""
expected = [14.142136, 14.142136, 10.0]
tolerance = 1e-05

[[vector]]
id = "two-cubes-facets"
provider = { component_count = 2, triangle_count = 24, volume = 250.0 }
# Two cubes 20 apart with 5 mm sides cannot touch, so exactly two components.
components = 2
n = 4
question = "facets"
fn = 0
why = """
Two disjoint 5 mm cubes, 12 triangles each."""
model = """
cube(5); translate([20, 0, 0]) cube(5);"""
note = """
A CORRECTION TO WHAT THIS NOTE FIRST SAID, which was committed and wrong. It
claimed neither side could answer component count, "not us, and not the
provider, which exports and does not measure". The provider DOES measure: its
`measure` tool returns component_count, and on this exact model it returns 2.
Driven 2026-11-16 against the pinned server over MCP.

So the finding is about OUR side, not the format and not the provider. A
binary STL is a triangle soup with no component structure, so the mesh reader
this runner uses cannot answer the question at all; the provider computes it
upstream of the export. That is the issue's own case -- a vector only one side
can compute is a finding about the other -- and here the other side is ours.

provider_component_count = 2, and this vector's own expectation stays the
facet count, which both sides agree on at 24."""
expected = 24
tolerance = 0

[[vector]]
id = "overlap-intersection"
provider = { volume = 500.0, component_count = 1 }
# The intersection of two overlapping convex solids is one convex solid.
components = 1
n = 5
question = "volume"
fn = 0
why = """
Two axis-aligned cubes offset by 5 in x: the intersection is 5 x 10 x 10. Closed form."""
model = """
intersection() { cube([10, 10, 10]); translate([5, 0, 0]) cube([10, 10, 10]); }"""
expected = 500.0
tolerance = 1e-09

[[vector]]
id = "sphere-fn64-facets"
provider = { triangle_count = 4092, volume = 4171.9988, component_count = 1 }
# A tessellated sphere is one closed shell.
components = 1
n = 6
question = "facets"
fn = 64
why = """
A sphere at $fn=64, as BINARY STL triangles. Tessellation, so no closed form: the recorded count is the agreement."""
model = """
$fn = 64; sphere(r = 10);"""
note = """
FACETS IS NOT A WELL-POSED QUESTION WITHOUT NAMING THE FORMAT, and this vector is where that was found. The live provider reported 1986 facets for this exact model; our CLI reports 4092. Both are right and the difference is the export: OFF keeps 1984 quads plus two 64-gon polar caps, which is 1986 faces, and triangulating them gives 1984*2 + 2*62 = 4092. MEASURED on both sides: our OFF export is 1986 faces too, and the exported bytes are IDENTICAL, sha256 a968dcfd9c6cdb05641864ff3499066945874cc4752be04fec65f05855de534a, 93544 bytes -- across OpenSCAD 2026.10.14 (ours) and 2026.11.05.nightly (the provider's). Same model, same tessellation, two legitimate counts."""
expected = 4092
tolerance = 0

[[vector]]
id = "sphere-fn64-volume"
provider = { volume = 4171.9988 }
n = 7
question = "volume"
fn = 64
why = """
The same sphere's POLYHEDRON volume. It must be UNDER the analytic 4188.790205 because the tessellation is inscribed; a value at or above it means the mesh is not the solid it claims to approximate."""
model = """
$fn = 64; sphere(r = 10);"""
note = """
analytic 4188.790205; the recorded value is 0.401% under it"""
# THE PROVIDER AND WE DISAGREE HERE, AND THE CAUSE IS NOT KNOWN.
# WITHDRAWN 2026-11-19, issue 62: this block used to say "the cause is in this
# file already" and cite the sphere-fn64-facets note above as establishing that
# the two kernels tessellate the same model differently. THAT NOTE SAYS THE
# OPPOSITE. It records the exported bytes as IDENTICAL across OpenSCAD
# 2026.10.14 and 2026.11.05.nightly -- same sha256,
# a968dcfd9c6cdb05641864ff3499066945874cc4752be04fec65f05855de534a, 93544
# bytes, "same model, same tessellation". Identical bytes are the same mesh, and
# the same mesh cannot have two polyhedron volumes. So my own citation refuted
# my own claim, and I read it as support because it was adjacent and agreed in
# tone. That is rook's class exactly (wm-review/2-3): A CITATION THAT EXISTS IS
# NOT A CITATION THAT MEANS WHAT YOU SAY IT MEANS.
#
# WHAT IS STILL MEASURED, and it is all that may be asserted here:
#   - 4171.9988 is not a rounding of 4171.998709. At four reported decimals it
#     stands for [4171.99875, 4171.99885) and ours falls below that.
#   - the gap is 4.1e-5, which is the distance to that INTERVAL, 9.8e-9
#     relative. CORRECTED 2026-11-19, rook F7(a): the figure recorded here and
#     in issue 54 was 9.1e-5, the distance to the reported POINT -- which is
#     the question issue 54 itself exists to call wrong. Agreement was decided
#     by containment while the SIZE of a disagreement was measured to the
#     point; tools/vector-run.py now uses the same rule for both.
#   - BOTH satisfy this vector's actual oracle -- inscribed, therefore under
#     the analytic 4188.790205 -- which is why this is recorded rather than
#     failed.
#
# WHAT IS NOT MEASURED: why they differ at all. Candidates I have NOT tested:
# the provider computing volume from the Manifold representation rather than
# from the exported mesh; a different accumulation order; or the provider's
# figure being a differently-rounded report of a different internal value.
# Naming one of those here without driving it would be the same defect again.
# `cause = "unknown"` makes the gap COUNTABLE instead of explained-away, and
# tools/vector-run.py prints the count.
# AND THE BOUND IS TIGHTER THAN THIS VECTOR'S OWN TOLERANCE, which it was not.
# rook F7(b): max_delta was 0.0001, identical to `tolerance` below -- the width
# issue 54 says "would have reported that clean". An acceptance at the old
# width is a waiver wearing a bound's name. 5e-5 covers the measured 4.1e-5 and
# nothing else, and vector-run.py now REFUSES a max_delta that is not tighter.
provider_disagrees = { max_delta = 0.00005, cause = "unknown", because = "the provider reports 4171.9988, standing for [4171.99875, 4171.99885); we compute 4171.998709, which misses that interval by 4.1e-5 (9.8e-9 relative). Both are under the analytic bound this vector actually tests, and NO cause has been measured -- the kernel-difference explanation once recorded here is refuted by the identical export bytes noted on sphere-fn64-facets" }
expected = 4171.998709
tolerance = 0.0001

[[vector]]
id = "cylinder-fn128-volume"
provider = { volume = 785.0828, triangle_count = 508 }
n = 8
question = "volume"
fn = 128
why = """
A cylinder at $fn=128, inscribed likewise: under pi*r^2*h = 785.398163."""
model = """
$fn = 128; cylinder(r = 5, h = 10);"""
note = """
analytic 785.398163; the recorded value is 0.040% under it"""
expected = 785.082777
tolerance = 0.0001

[[vector]]
id = "stage-blade-seat"
n = 9
question = "volume"
fn = 0
why = """
The can-cutter stage intersected with the blade in place: the blade seated in its pocket, a deliberate interference and not a defect."""
model = """
use <@FIXTURES@/can_cutter/can_cutter.scad>;
intersection() { blade_stage(); blade_in_place(); }"""
note = """
tests/fixtures/can_cutter/MANIFEST.toml records 0.1063 mm3 for the same probe"""
expected = 0.106258
tolerance = 0.001

[[vector]]
id = "frame-blade-empty"
n = 10
question = "volume"
fn = 0
why = """
The frame intersected with the blade: EMPTY, and empty is a VALUE."""
model = """
use <@FIXTURES@/can_cutter/can_cutter.scad>;
intersection() { frame(); blade_in_place(); }"""
note = """
OpenSCAD reports an empty 3D result as 'Current top level object is empty', exits 0, and writes NO FILE. This vector exists to pin that the runner reports emptiness rather than an error or, worse, the previous run's number. Reading absence as zero is only safe because the target is deleted first; corpus entry mcp-026 is the incident where four probes read a stale STL and reported 52.800 mm3 of material that was not there."""
expect_empty = true

# ---------------------------------------------------------------------------
# METAMORPHIC RELATIONS. docs/testing-methodology.md, Tier 1.
#
# These assert the RELATION between two measurements, never either one, so they
# need no oracle: nobody knows the correct volume of an arbitrary mesh, and
# everybody knows that scaling it by two must multiply that volume by eight.
#
# WHAT THEY CATCH THAT THE VECTORS ABOVE CANNOT. A golden vector finds two
# implementations that are each self-consistent and disagree. It is blind to
# two that AGREE AND ARE BOTH WRONG, because agreement is evidence about what
# the two share. A relation does not care what anyone agrees: either the figure
# scales by eight or it does not.
#
# EVERY MODEL HERE IS DELIBERATELY NOT ROUND. 7 x 11 x 13 rather than
# 10 x 10 x 10, because a cube has symmetries that make a rotation relation
# hold for the wrong reason -- permuting the dimensions of a cube changes
# nothing, so the relation would pass against a reader that ignored the
# rotation entirely.

[[relation]]
id = "scale-2x-volume-8x"
question = "volume"
factor = 8.0
tolerance = 1e-09
why = """
Volume is cubic in a uniform scale. No oracle: 1001 mm3 is the base's volume and nobody needs to know it."""
base = """
cube([7, 11, 13]);"""
transformed = """
scale([2, 2, 2]) cube([7, 11, 13]);"""

[[relation]]
id = "scale-2x-area-4x"
question = "area"
factor = 4.0
tolerance = 1e-09
why = """
Surface area is quadratic in a uniform scale. This and the volume relation above fail in DIFFERENT directions if a reader confuses the two."""
base = """
cube([7, 11, 13]);"""
transformed = """
scale([2, 2, 2]) cube([7, 11, 13]);"""

[[relation]]
id = "translate-conserves-volume"
question = "volume"
factor = 1.0
tolerance = 1e-09
why = """
A part that moved has the volume it had. This is the relation the 2d finding turned on: the provider measured a translated part at 3717.7106 mm3, exactly its original, which is why a volume-keyed diff reports no change for a pure translation."""
base = """
cube([7, 11, 13]);"""
transformed = """
translate([31, -17, 5]) cube([7, 11, 13]);"""

[[relation]]
id = "rotate-90-conserves-volume"
question = "volume"
factor = 1.0
tolerance = 1e-09
why = """
A rigid rotation conserves volume. The box is 7 x 11 x 13 on purpose: a cube would satisfy this against a reader that ignored the rotation."""
base = """
cube([7, 11, 13]);"""
transformed = """
rotate([0, 0, 90]) cube([7, 11, 13]);"""

[[relation]]
id = "mirror-conserves-volume"
question = "volume"
factor = 1.0
tolerance = 1e-09
why = """
A mirror conserves volume. MEASURED CORRECTION 2026-11-17: an earlier version of this comment claimed the relation catches a reader that sums signed tetrahedra without taking the absolute value. It does not. OpenSCAD writes outward-facing normals even after a mirror, so the signed volume stays positive and that defect is unreachable through this interface -- driven by dropping abs() from the reader, after which all sixteen arms still passed."""
base = """
cube([7, 11, 13]);"""
transformed = """
mirror([1, 0, 0]) cube([7, 11, 13]);"""

[[relation]]
id = "disjoint-union-sums-volume"
question = "volume"
tolerance = 1e-09
why = """
Two solids that do not touch have the volume of their parts. A kernel that welds or double-counts at the boundary fails this, and no single-model vector can see it. The two boxes are different sizes so a half-counting defect cannot cancel."""
base = """
union() { cube([7, 11, 13]); translate([40, 0, 0]) cube([3, 5, 2]); }"""
sum_of = [
  """
cube([7, 11, 13]);""",
  """
translate([40, 0, 0]) cube([3, 5, 2]);""",
]

# ---------------------------------------------------------------------------
# RELATIONS ON GEOMETRY WITH NO CLOSED FORM, 2026-11-17.
#
# These were written to test whether metamorphic relations deserve a TIER in
# docs/testing-methodology.md. THEY DO NOT, measured twice, and the tier was
# proposed, written, broadcast to the room, and withdrawn the same night. The
# relations are kept because they hold real invariants cheaply; the TIER was
# removed because it could not meet the document's own admission rule --
# "a tier that cannot answer a question the tier below it already answers is a
# tier to delete".
#
# ROUND 1. Six relations on cube([7,11,13]) and unions of cubes -- which is the
# VECTOR tier's own domain, so the test was aimed inside its competitor's
# strength. Round 2 re-aimed six more at the can cutter's real parts, a
# minkowski sum and a convex hull, where `expected = N` is unavailable by
# construction: nobody hand-computes 57932.72 mm3, so any figure would have to
# be recorded from a run, which this file's own header calls the one edit that
# turns a vector into a restatement.
#
#   defect in the mesh reader   vectors  closed-form rel  RE-AIMED rel
#   abs() removed                 0/10        0/6             0/6
#   triangle area halved          0/10        0/6             0/6
#   volume from the bbox          3/10        1/6             2/6
#   volume x1.5                   5/10        0/6             0/6
#   volume squared                5/10        2/6             3/6
#   last triangle dropped         4/10        2/6             2/6
#
# IN SIX DEFECTS THE RELATIONS CAUGHT NOTHING THE VECTORS MISSED, and the
# vectors caught strictly more wherever anything was caught.
#
# WHY THE TEST CANNOT SETTLE THE CLAIM, which is the more useful finding. The
# subject is OUR mesh reader -- thirty lines of arithmetic over a triangle
# list, shared by every shape. A defect there appears on a cube exactly as it
# appears on the frame, so complexity is irrelevant to it and the closed-form
# vectors will always win. A relation tier would earn its row only against a
# failure mode that NEEDS complex geometry: a spatial-index bug above some
# triangle count, a hull or minkowski-specific error, a tessellation-dependent
# drift. Our reader has no such mode, so the right subject was never our reader
# -- it is the provider, whose measurements we consume and cannot verify, and
# which cannot be mutated from here.
#
# TO REVISIT IT, the condition is specific rather than a hunch: find a defect
# that manifests ONLY on geometry no vector can cover, and show a relation
# catching it where the vectors cannot. Until such a defect exists, a tier is
# an argument and these are tests.
#
# Two defects nobody caught at all, worth keeping in view: a removed abs() (the
# kernel writes outward normals even after a mirror, so the sign never
# surfaces) and a halved triangle area (a constant factor cancels in a ratio by
# construction, and the closed-form area vectors do not cover area).
#
# AND THE STRONGEST DEGENERATE IS NOT ONE OF MINE. fable, coop main/966:
# "a reader returning zero volume satisfies scale, translation and disjoint
# union, which is why relations need an anchor from the vector tier."
# Verified -- every relation here passes against a reader that returns 0:
#
#   scale 2x -> 8x       0 == 0 * 8    True
#   area  2x -> 4x       0 == 0 * 4    True
#   translate -> 1x      0 == 0 * 1    True
#   rotate    -> 1x      0 == 0 * 1    True
#   mirror    -> 1x      0 == 0 * 1    True
#   disjoint union sum   0 == 0 + 0    True
#
# Six for six, and a BETTER degenerate than the three damaged readers above:
# those were wrong-but-nonzero, so arithmetic still had to catch them. This one
# is trivially broken and passes BY CONSTRUCTION.
#
# It also names the structural reason rather than an instance: a ratio cannot
# establish that a quantity is nonzero, so a relation needs an ANCHOR from the
# vector tier. "They sit beside each other" was the right conclusion; this is
# why, in a form a test can hold. The closed-form vectors above ARE that
# anchor, which is why they must not be removed in favour of relations.

[[relation]]
id = "frame-scale-volume-8x"
question = "volume"
factor = 8.0
tolerance = 1e-06
why = """
The can cutter's frame: 47 multmatrix nodes, nine polygons, two rotate_extrudes. NOBODY CAN COMPUTE ITS VOLUME, so no vector for it can exist -- `expected` would have to be recorded from a run, which makes it a restatement of whatever the code did. The ratio is available without the figure."""
base = """
use <@FIXTURES@/can_cutter/can_cutter.scad>;
frame();"""
transformed = """
use <@FIXTURES@/can_cutter/can_cutter.scad>;
scale([2, 2, 2]) frame();"""

[[relation]]
id = "frame-rotate-conserves-volume"
question = "volume"
factor = 1.0
tolerance = 1e-06
why = """
A rigid rotation of a real part. The angle is 37 degrees, not 90: a right angle on an axis-aligned part can hold for the wrong reason, and 37 forces every facet to move."""
base = """
use <@FIXTURES@/can_cutter/can_cutter.scad>;
frame();"""
transformed = """
use <@FIXTURES@/can_cutter/can_cutter.scad>;
rotate([0, 0, 37]) frame();"""

[[relation]]
id = "minkowski-scale-volume-8x"
question = "volume"
factor = 8.0
tolerance = 1e-06
why = """
A minkowski sum of a cuboid and a sphere. Its volume HAS a closed form in principle -- Steiner's formula -- and not at a given tessellation, which is the case that matters: the figure OpenSCAD produces at $fn=16 is not the analytic one, so a vector would have to record the run."""
base = """
minkowski() { cube([7, 11, 13]); sphere(r = 2, $fn = 16); }"""
transformed = """
scale([2, 2, 2]) minkowski() { cube([7, 11, 13]); sphere(r = 2, $fn = 16); }"""

[[relation]]
id = "hull-scale-area-4x"
question = "area"
factor = 4.0
tolerance = 1e-06
why = """
The convex hull of four spheres at irregular offsets. No closed form at any tessellation, and surface area rather than volume so the exponent differs from the relations above."""
base = """
hull() {
  translate([0, 0, 0]) sphere(r = 3, $fn = 24);
  translate([13, 2, 1]) sphere(r = 5, $fn = 24);
  translate([4, 17, 3]) sphere(r = 2, $fn = 24);
  translate([9, 6, 11]) sphere(r = 4, $fn = 24);
}"""
transformed = """
scale([2, 2, 2]) hull() {
  translate([0, 0, 0]) sphere(r = 3, $fn = 24);
  translate([13, 2, 1]) sphere(r = 5, $fn = 24);
  translate([4, 17, 3]) sphere(r = 2, $fn = 24);
  translate([9, 6, 11]) sphere(r = 4, $fn = 24);
}"""

[[relation]]
id = "stage-translate-conserves-volume"
question = "volume"
factor = 1.0
tolerance = 1e-06
why = """
The blade stage, which carries the dovetail sockets and the tenons -- the part the 2b work was built from. A part that moved has the volume it had, on geometry nobody has measured by hand."""
base = """
use <@FIXTURES@/can_cutter/can_cutter.scad>;
blade_stage();"""
transformed = """
use <@FIXTURES@/can_cutter/can_cutter.scad>;
translate([41, -23, 7]) blade_stage();"""

[[relation]]
id = "frame-plus-stage-disjoint-sums"
question = "volume"
tolerance = 1e-06
why = """
Two real parts, moved far enough apart to be disjoint. Additivity over disjoint parts is the one relation that separated a mesh volume from a bounding-box volume in the earlier measurement, and here neither side has a closed form."""
base = """
use <@FIXTURES@/can_cutter/can_cutter.scad>;
union() { frame(); translate([400, 0, 0]) blade_stage(); }"""
sum_of = [
  """
use <@FIXTURES@/can_cutter/can_cutter.scad>;
frame();""",
  """
use <@FIXTURES@/can_cutter/can_cutter.scad>;
translate([400, 0, 0]) blade_stage();""",
]
