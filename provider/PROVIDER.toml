# The provider Witness Marks consumes. Spec §03: consume it, do not rebuild it;
# fork only if it goes dark. Every number here was read from a registry, not
# recalled.
[provider]
name = "openscad-mcp"
upstream = "https://github.com/RobertCoop/openscad-mcp"
license = "MIT"
version = "0.6.1"
# TWO VERSION NUMBERS, AND THEY ARE NOT THE SAME SCHEME. `version` above is the
# PyPI distribution version, which is what uv resolves and what
# importlib.metadata reports. Over MCP a client never sees it: `initialize`
# returns serverInfo, and THAT reads 4.2.0. MEASURED 2026-11-16 by speaking
# stdio to the pinned 0.6.1 itself.
#
# A client that refuses on "serverInfo disagrees with PROVIDER.toml version"
# would therefore refuse every single run. So the expectation is recorded
# separately and the refusal is against THIS line, which is the only version a
# client can actually observe.
server_info_name = "OpenSCAD MCP Server"
server_info_version = "4.2.0"
mcp_protocol = "2024-11-05"
pypi_sdist_sha256 = "3a899b16676e5d8fa7255ae90183a1bca459a41f6c3bafaf144d59b736c08fcd"
git_tag_sha = "258c8a4553b62d0d1df1a37aa54c218ef3de5689"
pinned_on = "2026-11-14"
# THE KERNEL IS PART OF THE PIN, added 2026-11-17 (issue 56). PROVIDER.toml
# pinned the provider and said nothing about OpenSCAD, so every figure this
# project recorded was attributed to "the pinned provider" while the kernel
# underneath was whatever happened to be installed -- and the provider's own CI
# gates on 2021.01, five years off what this box runs. That combination has
# never been tested by anyone, which is where issue 53 lives.
#
# `kernel_version` IS THE KERNEL THESE FIGURES WERE TAKEN ON, and
# tools/provider-verify.py REFUSES when the running one differs. That refusal
# is the point: a measurement on a different kernel is a different
# measurement, so moving to one is a deliberate act -- re-record this line and
# re-run the vectors -- rather than something that happens quietly on a new box.
kernel_version = "2026.10.14"
# What the provider's own CI tests against, for contrast rather than for
# comparison. Recorded so the gap is visible in the file instead of having to
# be rediscovered from their workflow.
kernel_ci_pin = "2021.01"
# THE BACKEND IS A THIRD AXIS, added 2026-11-17. OpenSCAD 2026.10.14 takes
# `--backend=CGAL|Manifold` and defaults to Manifold on this build. Only CGAL
# emits the `Simple:` / `Volumes:` banner the provider's diagnostics parse, so
# this line -- not kernel_version -- is what decides whether
# mesh_health.manifold has a value at all. MEASURED: the same model under
# --backend=CGAL prints `Simple: yes  Volumes: 2`, and under Manifold or the
# default prints neither. That is issue 53, and it is a flag rather than a
# defect.
kernel_backend = "Manifold"
# What this version was observed to lack, and therefore what Witness Marks owns
# (spec §03 audit): mechanics, staleness propagation, dominance, input
# provenance, slicer-criterion printability, csg.eats/coincident, async jobs.
# ============================================================================
# THE AXES ENUMERATED (issue 58), added 2026-11-18. cal asked for a
# comprehensive source review of OpenSCAD and of the provider; the method here
# is enumeration of the DOCUMENTED CONFIGURATION SURFACES instead, for the
# reason the issue gives: `openscad --help` answers in 35 flags what a review
# of hundreds of thousands of lines of C++ would answer more expensively, and
# the provider's Config.from_env reads 20 environment knobs in one 445-line
# module.
#
# CORRECTED 2026-11-19 (rook, finding F2 on thread:wm-review). This block said
# the provider's knobs "are all declared" in that module. THEY ARE NOT, and the
# counter-example is an axis recorded below: OPENSCADPATH is read in server.py
# (:352 building the subprocess environment, :423 enumerating library search
# paths) and appears ZERO times in config.py. BOSL2's version is on neither
# module -- it is read from BOSL2/version.scad in the library tree.
#
# THE SCORE, which is the argument for enumerating, with the two surfaces
# credited only for what they produced: three axes were found before this,
# every one by something breaking. Of the seven found next, FIVE came from
# reading the two documented surfaces once, and TWO came from chasing where a
# mechanism resolves after the surface turned out to be silent about it.
# Discovery-by-accident is still what this replaces -- the same rule the
# project holds for guards, "enumerate, never name" -- with the limit stated:
# an enumeration reaches exactly as far as the surface enumerated, and a module
# named `config` is not proof that the configuration surface ends there.
#
# WHICH STL FLAVOR `-o x.stl` WRITES. MEASURED 2026-11-18: the bytes begin
# `solid OpenSCAD_M`, 1497 bytes for cube([10,10,10]), so ASCII. This is an
# axis rather than a detail because wm-model's digest_of_export and
# digest_of_bytes are both taken OVER THESE BYTES -- and OpenSCAD's own --help
# announces the change: "ASCII export is the current stl default, but binary
# stl is planned as the future default so asciistl should be explicitly
# specified in scripts when needed." The day that flips, every recorded digest
# changes and nothing we hold would say why.
kernel_export_format_stl = "asciistl"
# THE LIBRARY SET IS NOT A PROPERTY OF THIS CHECKOUT. MEASURED 2026-11-18 from
# BOSL2/version.scad's own BOSL_VERSION: 2.0.716, in
# ~/.local/share/OpenSCAD/libraries, which is the same figure the fork's
# recorded baseline names. The corpus uses BOSL2, so its version is a pin.
library_bosl2 = "2.0.716"
# THE SECTION CONTOUR CAP, an axis found 2026-11-19 while fixing rook's F11.
# MEASURED at server.py:3556: `cap = 400 if detailed else 60`, and past the cap
# the reply carries ["...", "N more"] in place of the remaining points. So a
# `measure(mode=section)` WITHOUT `response_format = "detailed"` truncates every
# contour of real geometry -- a $fn=100 cylinder returns 61 entries concise and
# 100 detailed. This is an axis rather than a detail because a truncated point
# list is where wm-model computes a contour's centroid, area and bbox from: the
# figures would be wrong AND would look measured. wire::section_from refuses a
# truncated list instead, and crates/wm-provider/examples/section-from-provider.rs
# (driven by tools/tests/vectors-arms.sh) verifies BOTH caps against the live
# provider. The POINTS are `round(x, 4)` either way -- detailed moves the cap,
# not the precision.
section_contour_cap_concise = "60"
section_contour_cap_detailed = "400"
section_point_decimals = "4"
#
# [env] -- THE KNOBS, each `env_NAME`. "" means MUST BE UNSET; recording a
# value is the supported way to set one deliberately, per the project's rule to
# err toward configurability with a default that derives. All MEASURED unset
# 2026-11-18, so every figure already recorded was taken at the defaults.
#
# These are the ones that can change a figure or DEFEAT A PIN ABOVE:
# OPENSCAD_PATH chooses which binary the provider runs, which would make
# `kernel_version` a statement about a binary that is not the one used;
# OPENSCADPATH changes which libraries resolve; MCP_HARD_WARNINGS turns a
# warning into a failure and so changes verdicts; the timeout and the three
# bounds turn a success into a refusal, which is a different answer and not a
# smaller one.
[env]
env_OPENSCAD_PATH = ""
env_OPENSCADPATH = ""
env_MCP_HARD_WARNINGS = ""
env_MCP_RENDER_TIMEOUT = ""
env_MCP_MAX_FILE_SIZE_MB = ""
env_MCP_MAX_MEMORY_MB = ""
env_MCP_ALLOWED_PATHS = ""
# A `.env` ANYWHERE ABOVE THE INSTALLED config.py supplies any of the above
# invisibly: the provider calls `load_dotenv()` with no argument on every
# Config.from_env(), and python-dotenv then searches upward FROM THE CALLER'S
# FILE, not from the working directory -- find_dotenv takes the frame's
# __file__ (dotenv/main.py:305-306) and uses os.getcwd() only when usecwd=True,
# or when the interpreter is interactive or frozen (:300). So the tree that
# matters is provider/.venv/.../openscad_mcp/utils/ and its parents.
# CORRECTED 2026-11-19 (rook, F2 on thread:wm-review): this comment and
# tools/provider-verify.py both named the working directory, which is a
# DIFFERENT TREE on this box -- rc 12 was guarding the wrong one and would have
# passed with a .env sitting next to the provider. MEASURED 2026-11-19: none
# reachable from the installed config.py's directory.
dotenv_refused = "true"
# ENUMERATED AND DELIBERATELY NOT REFUSED, so the omission is stated rather
# than silent. MCP_CACHE_ENABLED / _SIZE_MB / _TTL_HOURS default to on, 500 MB,
# 24 h, and the cache directory on this box holds 8 entries dated 2026-11-16 --
# the day the provider figures were taken, which looks alarming and is not:
# MEASURED, the cache has exactly ONE reader, `_check_cache` at server.py:944,
# inside render_scad_to_png. It serves PNG renders and nothing else; no
# measure, validate, check or scad_eval result is cached, and those 8 entries
# carry /tmp/pytest-of-cpower paths from the provider's own suite. So no
# recorded figure is implicated and a refusal here would cost precision
# nothing. MCP_PORT, MCP_HOST, MCP_TRANSPORT, MCP_LOG_*, MCP_RATE_LIMIT,
# MCP_MAX_IMAGE_*, MCP_MAX_CONCURRENT_RENDERS, MCP_TEMP_DIR and
# IMAGEMAGICK_PATH are transport, logging, image-size and concurrency knobs
# that cannot move a geometric figure.
